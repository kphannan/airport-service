## ------------------------------------
## ----- Bundles -----
[bundles]
spring-boot-base = [

    'spring-boot-starter',
    'spring-boot-starter-actuator',
    # 'spring-boot-validation',
    'spring-boot-starter-web',
    'spring-boot-starter-security',
    'spring-boot-logging',
    'jackson-databind',
    'jackson-dataformat-yaml',
    'jackson-dataformat-xml',
    'apache-commons',
    'google-guava'
]

spring-boot-persistence = [
#    'spring-boot-starter-jpa',
#    'flexy-pool-spring-boot-starter',
#    'datasource-proxy-spring-boot-starter'
]

persistence = [
    'spring-boot-starter-jpa',
    'flexy-pool-spring-boot-starter',
    'datasource-proxy-spring-boot-starter',
    'liquibase'
]

persistence-connector = [
    'db2',
    'h2',
    'mariadb',
    'mysql',
    'oracle',
    'postgresql'
]

spring-validation = [
    'spring-boot-starter-validation',
    'hibernate-validation',
    'jspecify',
    'jakarta-annotation'
]

unit-test = [
    'assertj',
    'jsonassert'
]

# --- Plugins can't be part of a bundle
#plugins-static-analysis = [
#    'checkstyle',
#    'pmd'
#]


## ------------------------------------
## ----- Plugins -----
[plugins]
versioning = { id = 'net.nemerosa.versioning', version.ref = 'versioningVersion' }
lombok = { id = 'io.freefair.lombok', version.ref = 'lombokVersion' }

# ----- Testing -----
# --- Unit ---
# --- BDD ---

# ----- Static Analysis -----
# --- Code Style ---
#checkstyle = { id = 'checkstyle', version.ref = 'checkstyleVersion' }
checkstyle = { id = 'checkstyle' }
# --- Common Defects ---
#pmd = { id = 'pmd', version.ref = 'pmdVersion' }
pmd = { id = 'pmd' }
# ----- Runtime Analysis -----
# --- Code Coverage ---
# jacoco = { id = 'jacoco' }
jacoco = { id = 'jacoco' }
# --- Mutation ---
pitest = { id = 'info.solidsoft.pitest', version.ref = 'pitPluginVersion' }
# --- Performance ---
gatling = { id = 'io.gatling.gradle', version.ref = 'gatlingVersion' }
