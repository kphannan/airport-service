## ------------------------------------
## ----- Bundles -----
[bundles]
# TODO split test packages to their own bundle
spring-boot-base = [

    'spring-boot-starter',
#    'spring-boot-starter-test',
    'spring-boot-starter-actuator',
    'spring-boot-starter-webmvc',
    'spring-boot-starter-webmvc-test',
#    'spring-boot-starter-webclient',
#    'spring-boot-starter-webclient-test',
#    'spring-boot-starter-resclient',
#    'spring-boot-starter-resclient-test',
    'spring-boot-starter-security',
    'spring-boot-logging',
    'apache-commons',
    'google-guava',
    'json-patch'
]

spring-boot-test = [
    'spring-boot-starter-actuator-test',
    'spring-boot-starter-validation-test',
    'spring-boot-starter-jpa-test',
    'spring-boot-starter-liquibase-test',
    'spring-boot-starter-restlient-test',
    'spring-boot-starter-security-test'
]

bindings = [
    'mapstruct',
    'mapstruct-processor'
]

persistence = [
    'spring-boot-starter-jpa',
    'flexy-pool-spring-boot-starter',
    'datasource-proxy-spring-boot-starter',
    'spring-boot-starter-liquibase'
]

persistence-connector = [
    'db2',
    'h2',
    'h2-console',
    'mariadb',
    'mysql',
    'oracle',
    'postgresql'
]

spring-validation = [
    'spring-boot-starter-validation',
    'hibernate-validation',
    'jspecify',
    'jakarta-annotation'
]

unit-test = [
    'assertj',
#    'jsonassert',
    'jsonUnitAssert',
    'jsonUnitAssertSpring'
]

# --- Plugins can't be part of a bundle
#plugins-static-analysis = [
#    'checkstyle',
#    'pmd'
#]


## ------------------------------------
## ----- Plugins -----
[plugins]
versioning = { id = 'net.nemerosa.versioning', version.ref = 'versioningVersion' }
lombok = { id = 'io.freefair.lombok', version.ref = 'lombokVersion' }

# ----- Testing -----
# --- Unit ---
# --- BDD ---

# ----- Static Analysis -----

# --- Code Style ---
checkstyle = { id = 'checkstyle' }
# --- Common Defects ---
pmd = { id = 'pmd' }

# ----- Runtime Analysis -----
# --- Code Coverage ---
jacoco = { id = 'jacoco' }
# --- Mutation ---
pitest = { id = 'info.solidsoft.pitest', version.ref = 'pitPluginVersion' }
# --- Performance ---
gatling = { id = 'io.gatling.gradle', version.ref = 'gatlingVersion' }

#openrewrite = { id = 'io.gatling.gradle', version.ref = 'openRewriteVersion' }
# --- OpenRewrite ---
openRewrite = { id = 'org.openrewrite.rewrite', version.ref = 'openRewriteVersion' }
