
## ------------------------------------
## ----- Versions -----
[versions]

springBootVersion = '4.0.3'
#springCloudVersion = '2024.0.1'
#

# --- Developer Tools ---
#  -- OpenRewrite --
openRewriteVersion = '7.23.0'   #'latest.release'

# --- Persistence ---
hibernateValidationVersion = '9.1.0.Final'
postgresqlVersion = '42.7.11'

lombokVersion = '9.2.0'
versioningVersion = '3.1.0'
logcaptorVersion = '2.10.2'

# --- Unit Testing ---
jsonassertVersion = '2.0-rc1'
jsonUnitAssertVersion = '5.1.1'
assertjVersion = '4.0.0-M1'

# --- Data binding ---
jacksonDatabindVersion = '3.1.0'
mapstructVersion = '1.6.3'
jakartaAnnotationVersion = '3.0.0'
#jakartaValidationVersion = '3.0.2'

# --- OpenAPI / Swagger ---
swaggerVersion = '3.0.3'

# --- JSepcify - tool neutral null checks
jspecifyVersion = '1.0.0'

# --- Google Guava
guavaVersion = '33.4.8-jre'

# --- Apache Commons ---
apacheCommonsCollectionsVersion = '4.5.0'

# --- FlexyPool - JDBC stats ---
flexyPoolVersion = '1.12.1'

# ----- Static Analysis -----
# --- Mutation Testing (pitest) ---
pitPluginVersion = '1.19.0-rc.3'
pitVersion = '1.22.1'
# --- Coding practices (static analysis) ---
# --- Coding style
# --- Checkstyle ---
checkstyleVersion = '13.4.2'
# --- Common Coding flaws
# --- PMD ---
pmdVersion = '7.21.0'
# --- Performance Testing (Gatling) ---
gatlingVersion = '3.14.9.8'

# --- Karate BDD ---
karateVersion               = '1.5.2'

## ------------------------------------
## ----- Libraries -----
[libraries]
logcaptor = { group = 'io.github.hakky54', name = 'logcaptor', version.ref = 'logcaptorVersion' }


# --- Jakarta ---

# --- Jakarta Annotations ---
jakarta-annotation = { module = 'jakarta.annotation:jakarta.annotation-api', version.ref = 'jakartaAnnotationVersion' }  # TODO change to JSpec

# --- JSpecify (Stanard Annotations) ---
jspecify = { module = 'org.jspecify:jspecify', version.ref = 'jspecifyVersion' }

# --- MapStruct ---
mapstruct = { group = 'org.mapstruct', name = 'mapstruct', version.ref = 'mapstructVersion' }
mapstruct-processor = { group = 'org.mapstruct', name = 'mapstruct-processor', version.ref = 'mapstructVersion' }

# --- Google guava ---
google-guava = { module = 'com.google.guava:guava', version.ref = 'guavaVersion' }

# --- Apache Commons ---
apache-commons = { module = 'org.apache.commons:commons-collections4', version.ref = 'apacheCommonsCollectionsVersion' }

# --- OpenAPI ---
springdoc-openapi-ui = { module = 'org.springdoc:springdoc-openapi-starter-webmvc-ui', version.ref = 'swaggerVersion' }
springdoc-openapi-api = { module = 'org.springdoc:springdoc-openapi-starter-webmvc-api', version.ref = 'swaggerVersion' }

# --- Spring Boot ---
spring-boot-starter            = { module = 'org.springframework.boot:spring-boot-starter',             version.ref = 'springBootVersion' }
#spring-boot-starter-test       = { module = 'org.springframework.boot:spring-boot-starter-test',        version.ref = 'springBootVersion' }
spring-boot-logging            = { module = 'org.springframework.boot:spring-boot-starter-logging',     version.ref = 'springBootVersion'  }
# --- Spring Boot 4 ---
spring-boot-starter-actuator   = { module = 'org.springframework.boot:spring-boot-starter-actuator',    version.ref = 'springBootVersion' }
spring-boot-starter-actuator-test   = { module = 'org.springframework.boot:spring-boot-starter-actuator-test',    version.ref = 'springBootVersion' }
spring-boot-starter-validation = { module = 'org.springframework.boot:spring-boot-starter-validation',  version.ref = 'springBootVersion' }
spring-boot-starter-validation-test = { module = 'org.springframework.boot:spring-boot-starter-validation-test',  version.ref = 'springBootVersion' }
spring-boot-starter-webmvc        = { module = 'org.springframework.boot:spring-boot-starter-webmvc',         version.ref = 'springBootVersion' }
spring-boot-starter-webmvc-test   = { module = 'org.springframework.boot:spring-boot-starter-webmvc-test',         version.ref = 'springBootVersion' }

#spring-boot-starter-weclient        = { module = 'org.springframework.boot:spring-boot-starter-webclient',         version.ref = 'springBootVersion' }
#spring-boot-starter-weclient-test   = { module = 'org.springframework.boot:spring-boot-starter-webclient-test',         version.ref = 'springBootVersion' }
spring-boot-starter-restlient        = { module = 'org.springframework.boot:spring-boot-starter-restclient',         version.ref = 'springBootVersion' }
spring-boot-starter-restlient-test   = { module = 'org.springframework.boot:spring-boot-starter-restclient-test',         version.ref = 'springBootVersion' }

json-patch = { module = 'com.github.java-json-tools:json-patch', version = '1.13' }


# --- Persistence ---
spring-boot-starter-jpa = { module = 'org.springframework.boot:spring-boot-starter-data-jpa', version.ref = 'springBootVersion' }
spring-boot-starter-jpa-test = { module = 'org.springframework.boot:spring-boot-starter-data-jpa-test', version.ref = 'springBootVersion' }
hibernate-validation = { module = 'org.hibernate.validator:hibernate-validator', version.ref = 'hibernateValidationVersion' }
spring-boot-starter-liquibase      = { module = 'org.springframework.boot:spring-boot-starter-liquibase',  version.ref = 'springBootVersion' }
spring-boot-starter-liquibase-test = { module = 'org.springframework.boot:spring-boot-starter-liquibase-test',  version.ref = 'springBootVersion' }
db2 = { module = 'com.ibm.db2:jcc' }
h2 = { module = 'com.h2database:h2' }
h2-console = { module = 'org.springframework.boot:spring-boot-h2console' }
mariadb = { module = 'org.mariadb.jdbc:mariadb-java-client' }
mysql = { module = 'com.mysql:mysql-connector-j' }
oracle = { module = 'com.oracle.database.jdbc:ojdbc11' }
postgresql = { module = 'org.postgresql:postgresql', version.ref='postgresqlVersion'}


# --- Security ---
spring-boot-starter-security = { group = 'org.springframework.boot', name = 'spring-boot-starter-security', version.ref = 'springBootVersion' }
spring-boot-starter-security-test = { group = 'org.springframework.boot', name = 'spring-boot-starter-security-test', version.ref = 'springBootVersion' }

# --- Unit Testing ---
spring-boot-starter-test = { group = 'org.springframework.boot', name = 'spring-boot-starter-test', version.ref = 'springBootVersion' }
assertj = { module = 'org.assertj:assertj-core', version.ref = 'assertjVersion' }
#jsonassert = { module = 'org.skyscreamer:jsonassert', version.ref = 'jsonassertVersion' }
jsonUnitAssert = { module = 'net.javacrumbs.json-unit:json-unit-assertj', version.ref = 'jsonUnitAssertVersion' }
jsonUnitAssertSpring = { module = 'net.javacrumbs.json-unit:json-unit-spring', version.ref = 'jsonUnitAssertVersion' }
karate-bdd = { module = 'io.karatelabs:karate-junit5', version.ref = 'karateVersion'}

