platform: linux

inputs:
  - name: source-code
  - name: .gradle
  - name: .m2

outputs:
  - name: source-code
  - name: .gradle
  - name: .m2

caches:
  - path: ./gradle/
  - path: ./m2/
  - path: build-logic/build

run:
  dir: source-code
  path: sh
  args:
    - -cx
    - |
      echo "Step 2b: Mutation Test"

      # Detect build tool and run lifecycle
      if [ -f "pom.xml" ]; then
        targetCommand="mvn mutation-test:run"
      elif [ -f "build.gradle" ]; then
        targetCommand="./gradlew  pitest"
      fi

      echo $targetCommand
      eval "$targetCommand"

      # echo "--------------------------------------------------------------"
      # touch {.,build-logic,api,app,lib}/build/pitest.md

      # echo "--------------------------------------------------------------"
      # find . -name '*.md'
