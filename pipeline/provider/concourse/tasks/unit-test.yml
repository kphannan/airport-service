platform: linux

inputs:
  - name: source-code
  - name: .gradle
  - name: .m2

outputs:
  - name: source-code
  - name: .gradle
  - name: .m2

caches:
  - path: .gradle/
  - path: .m2/
  - path: build-logic/build

run:
  dir: source-code
  path: sh
  args:
    - -c
    - |
      echo "Step 2a: Unit Tests & Coverage"

      export ROOT_FOLDER=$(pwd)/..
      export GRADLE_USER_HOME="${ROOT_FOLDER}/.gradle"
      export M2_HOME=${ROOT_FOLDER}/.m2
      export M2_LOCAL_REPO="${ROOT_FOLDER}/.m2"

      echo "HOME set to " ${HOME}

      # Detect build tool and run lifecycle
      if [ -f "pom.xml" ]; then
        targetCommand="mvn verify coverage:report"
      elif [ -f "build.gradle" ]; then
        targetCommand="./gradlew check jacocoTestReport jacocoTestCoverageVerification"
      fi

      # echo $targetCommand
      eval "$targetCommand"
