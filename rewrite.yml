---
type: specs.openrewrite.org/v1beta/style
name: com.kph.Whitespace
styleConfigs:
  - org.openrewrite.java.style.WrappingAndBraceStyle:
      IfStatement:
        forceBraces: Always
        elseOnNewLine: true
        specialElseIfTreatment: false
  - org.openrewrite.java.style.TabsAndIndentsStyle:
      useTabCharacter: false
      indentSize: 4
      continuationIndent: 4
      tabSize: 4

