            <defs>
              <style type="text/css">svg {
          background-color: #fff; }
        
        .root text,
        .root tspan {
          font: 12px Arial; }
        
        .root path {
          fill-opacity: 0;
          stroke-width: 2px;
          stroke: #000; }
        
        .root circle {
          fill: #6b6659;
          stroke-width: 2px;
          stroke: #000; }
        
        .anchor text, .any-character text {
          fill: #fff; }
        
        .anchor rect, .any-character rect {
          fill: #6b6659; }
        
        .escape text, .charset-escape text, .literal text {
          fill: #000; }
        
        .escape rect, .charset-escape rect {
          fill: #bada55; }
        
        .literal rect {
          fill: #dae9e5; }
        
        .charset .charset-box {
          fill: #cbcbba; }
        
        .subexp .subexp-label tspan,
        .charset .charset-label tspan,
        .match-fragment .repeat-label tspan {
          font-size: 10px; }
        
        .repeat-label {
          cursor: help; }
        
        .subexp .subexp-label tspan,
        .charset .charset-label tspan {
          dominant-baseline: text-after-edge; }
        
        .subexp .subexp-box {
          stroke: #908c83;
          stroke-dasharray: 6,2;
          stroke-width: 2px;
          fill-opacity: 0; }
        
        .quote {
          fill: #908c83; }
        </style>
