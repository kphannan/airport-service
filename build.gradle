

buildscript {
    ext {
        //   see gradle/lib.versions.toml for dependencies and versions

        basePackage                 = 'com.example'

        // --- Compiler extensions
        checkerFrameworkVersion     = '0.6.52'
        // --- YAML support
        // --- Logging (log4j)
        log4jVersion                = '2.24.3'

        // --- OpenAPI

        // ===== Frameworks =====
        // --- model mapping

        // --- Spring  Boot
//        springBootVersion           = '4.0.3'
//        springBootVersion           = libs.versions.springBootVersion
//    	springCloudVersion          = '2025.1.1'

        // ===== Quality checks =====

        // --- Coding practices (static analysis) ---

        spotbugsVersion             = '6.0.26'

        // --- Testing ---
        // --- Unit Test
        junitVersion                = '5.12.2'

        // --- BDD / REST Testing
        karateVersion               = '1.5.2'

        // ===== Configuration Management =====

        // --- Artifact Versioning
        nemerosaVersion             = '3.1.0'
        gorylenkoVersion            = '2.5.0'

        // --- Artifact Publishing
        //publishingVersion           = '3.1.0'
        //  SECTION_VERSIONTAGS

        // =====
        // --- Code Style
        spotlessVersion             = '7.0.0.BETA4'

    	// set('springCloudVersion', "2024.0.1")     // TODO move to spring convention
    }


}



plugins {
    // ===== IDE =====
    id 'idea'
    id 'eclipse'
    id 'visual-studio'
    // id 'com.diffplug.spotless' version "${spotlessVersion}" apply false
    // id 'com.github.spotbugs' version "${spotbugsVersion}" apply false
    // id 'net.ltgt.errorprone' version '3.0.1' apply false
    // id 'net.nemerosa.versioning' version "${nemerosaVersion}" apply false
    // id 'com.gorylenko.gradle-git-properties' version "${gorylenkoVersion}" apply false
    // id 'com.github.ben-manes.versions' version '0.48.0' apply false
    // id 'com.github.spotbugs' version "${spotbugsVersion}" apply false
    // id 'net.ltgt.errorprone' version '3.0.1' apply false
    // id 'com.github.ben-manes.versions' version '0.48.0' apply false

    // ===== Frameworks =====
    // --- Spring boot
    alias( libs.plugins.springBoot ).apply( false )
    alias( libs.plugins.springDependencyManagement ).apply( false )

    alias( libs.plugins.lombok ).apply( false )

    // --- Compile time
//    id 'org.checkerframework' version "${checkerFrameworkVersion}" apply false

    alias( libs.plugins.checkstyle )
    alias( libs.plugins.pmd )
    alias( libs.plugins.jacoco )

    // --- Mutation testing
    alias( libs.plugins.pitest ).apply( false )


    // --- Performance Testing
    alias( libs.plugins.gatling ).apply( false )

    alias( libs.plugins.openRewrite ).apply( false )

    // ===== Configuration Management =====
    // --- Artifact Versioning
    // id 'net.nemerosa.versioning' version "${nemerosaVersion}" apply false
    // id "com.gorylenko.gradle-git-properties" version "${gorylenkoVersion}" apply false

    // id 'com.diffplug.spotless' version "${spotlessVersion}" apply false

    // id 'com.github.spotbugs' version "${spotbugsVersion}" apply false
}
