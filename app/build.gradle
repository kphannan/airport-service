plugins {
    id 'buildlogic.java-application-conventions'
    // id 'buildlogic.java-spring-conventions'

    // TODO move these to the spring conventions....
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'


    // id 'com.gorylenko.gradle-git-properties'
}





configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }

    // integrationTestImplementation.extendsFrom testImplementation
    // integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}


dependencies {
    // implementation project(':utilities')
    implementation project( ':api' )
    implementation project( ':lib' )


	implementation libs.bundles.spring.boot.base

    // --- Annotation Processor
	implementation libs.bundles.spring.validation

    annotationProcessor libs.mapstruct.processor

    // ----- Frameworks -----
    // --- Logging
    // --- Data format / validation
    implementation libs.bundles.bindings
    //   - needed for yaml configuration of log4j2

    // --- OpenAPI doc
    implementation libs.springdoc.openapi.ui
    implementation libs.springdoc.openapi.api

    // ===== Persistence =====
    implementation libs.bundles.persistence

    // --- Database connectors ---
    runtimeOnly libs.bundles.persistence.connector

    // ----- Quality Assurance -----
    testAnnotationProcessor libs.mapstruct.processor
    // --- Unit Testing
	testImplementation libs.logcaptor

    testImplementation libs.spring.boot.starter.test

    // --- BDD
//    bddTestImplementation( "io.karatelabs:karate-junit5:${karateVersion}" )
//    implementation( "io.karatelabs:karate-core:${karateVersion}" )
}


processResources {
    filesMatching('application.properties') {
        expand(project.properties)
    }
}





application {
    // Define the main class for the application.
    // mainClass = 'com.example.app.App'
    mainClass = 'com.example.AirportServiceApplication'
}



